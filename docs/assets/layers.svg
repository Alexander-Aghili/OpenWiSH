<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">OpenWiSH: Read, Write and Harness layers</title>
<desc id="d">Three cards. Read: load(name), NAMES, weights as text, budgeted forward probes, arrays only. Write: save_edit, drop_edit, checkpoint, restore, edits(), the edits language and ops, one Rust edit gate with a per-task policy, an append-only ledger with hashes, portable edit sets. Harness: openwish run, resume, status, replay, score, audit, budgets, handoff, retries, crash-resume, the sandbox, static checks and the auditor, environments as TOML tasks. Each card lights up in turn.</desc>
