<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-label="Blog environments, published agent against Claude Opus 5.5 through OpenWiSH" class="c"><title>Blog environments, published agent against Claude Opus 5.5 through OpenWiSH</title><style>
.c{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;
