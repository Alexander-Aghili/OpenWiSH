<rect x="0.5" y="0.5" width="899" height="527" rx="14" fill="#10161e" stroke="#2c3644" stroke-width="1"/>
<text x="22" y="34" font-size="18" font-weight="700" xml:space="preserve">The edit gate</text>
<text x="22" y="55" font-size="12.5" class="muted" xml:space="preserve">Every weight change passes one Rust gate. Messages and hashes come from a real run of a two-tensor demo task.</text>
<rect x="20" y="68" width="860" height="30" rx="8" fill="#18212c" stroke="#33404f" stroke-width="1"/>
<text x="34" y="88" font-size="12.5" class="mono muted" xml:space="preserve">task.toml</text>
<text x="112" y="88" font-size="12.5" class="mono pre" xml:space="preserve">[edits] policy = { forbidden = [&quot;norm*&quot;], forbid_whole_tensor_scale = true, max_frac_changed = 0.7 }</text>
<rect x="20" y="106" width="860" height="30" rx="8" fill="#18212c" stroke="#33404f" stroke-width="1"/>
<g class="k1"><text x="34" y="126" font-size="14" font-weight="600" xml:space="preserve">Edit 1: W times one constant. The gate refuses the edit and returns the reason.</text>
</g><g class="k2"><text x="34" y="126" font-size="14" font-weight="600" xml:space="preserve">Edit 2: the diagonal of W set to 1. Every check passes, and the gate writes ledger line 1.</text>
</g><g class="rm-show" opacity="0"><text x="34" y="126" font-size="14" font-weight="600" xml:space="preserve">A refused edit leaves no ledger line. An accepted edit gets an id, both hashes and a reason.</text>
</g><rect x="330" y="152" width="260" height="246" rx="12" fill="#18212c" stroke="#33404f" stroke-width="1"/>
<text x="346" y="178" font-size="15" font-weight="700" xml:space="preserve">Edit gate</text>
<rect x="531.45" y="164" width="46.55" height="18" rx="9" fill="none" stroke="#d68cc6" stroke-width="1"/>
<text x="554.725" y="177" font-size="10.5" font-weight="600" style="fill:#d68cc6" text-anchor="middle" xml:space="preserve">Write</text>
<text x="346" y="198" font-size="12" class="muted" xml:space="preserve">checks run in this order</text>
<text x="346" y="224" font-size="13" xml:space="preserve">allowed tensors</text>
<text x="346" y="239" font-size="11.5" class="mono muted" xml:space="preserve">not set: any tensor</text>
<circle cx="566" cy="220" r="10" fill="none" stroke="#33404f"/><text x="346" y="258" font-size="13" xml:space="preserve">forbidden tensors</text>
<text x="346" y="273" font-size="11.5" class="mono muted" xml:space="preserve">norm*</text>
<circle cx="566" cy="254" r="10" fill="none" stroke="#33404f"/><text x="346" y="292" font-size="13" xml:space="preserve">finite values</text>
<text x="346" y="307" font-size="11.5" class="mono muted" xml:space="preserve">no NaN or inf</text>
<circle cx="566" cy="288" r="10" fill="none" stroke="#33404f"/><text x="346" y="326" font-size="13" xml:space="preserve">whole-tensor constant scale</text>
<text x="346" y="341" font-size="11.5" class="mono muted" xml:space="preserve">new = c × old is refused</text>
<circle cx="566" cy="322" r="10" fill="none" stroke="#33404f"/><text x="346" y="360" font-size="13" xml:space="preserve">max fraction changed</text>
<text x="346" y="375" font-size="11.5" class="mono muted" xml:space="preserve">limit 70.0000%</text>
<circle cx="566" cy="356" r="10" fill="none" stroke="#33404f"/><text x="22" y="290" font-size="12" class="muted" xml:space="preserve">save_edit is an RPC to the Rust gate.</text>
<text x="22" y="309" font-size="12" class="muted" xml:space="preserve">The kernel sees the weight files</text>
<text x="22" y="328" font-size="12" class="muted" xml:space="preserve">read-only.</text>
<text x="22" y="355" font-size="12" class="mono faint" xml:space="preserve">openwish-tensor/src/gate.rs</text>
<text x="22" y="374" font-size="12" class="mono faint" xml:space="preserve">Gate::apply</text>
