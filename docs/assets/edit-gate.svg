<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 528" width="900" height="528" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">The OpenWiSH edit gate</title>
<desc id="d">Two save_edit calls reach the edit gate. The gate checks allowed tensors, forbidden tensors, finite values, whole-tensor constant scale and the maximum fraction changed. The first edit, W times 2, fails the scale check and returns: edit refused: W: multiplying a whole tensor by a constant (2.0000) is not allowed in this task. The second edit passes every check and becomes ledger line 1 with its before and after hashes.</desc>
