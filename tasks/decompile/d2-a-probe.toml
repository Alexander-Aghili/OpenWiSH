# Generated by scripts/prepare_decompile.py.
id = "decompile-d2-a-probe"
description = "Decompile: rewrite a 10-16-8-3 ReLU MLP trained on a secret 10-bit rule as a program whose variables map to its units; Python over the weights and 3 forward passes of up to 16 inputs."
prompt = "prompts/d2-a-probe.txt"
hidden = ["../../assets/decompile/d2-a/secret.json", "../../assets/decompile/d2-a/reference.json"]

[network]
base = "../../assets/decompile/d2-a/net"


[python]
runs = 60
timeout_s = 300
mem_gb = 4
max_out = 20000
prelude = "prelude.py"

[forward.forward]
command = ["{root}/assets/venvs/sandbox/bin/python", "-I", "{root}/python/adapters/decompile_probe.py", "--max-inputs", "16"]
passes = 3
out_dir = "fwd_{k}"
max_out = 20000
timeout_s = 120

[edits.policy]
forbidden = ["*"]

[finish]
max_turns = 200

[editor]
effort = "high"

[score]
command = ["{root}/assets/venvs/sandbox/bin/python", "-I", "{root}/python/adapters/decompile_score.py", "--net", "{root}/assets/decompile/d2-a/net", "--secret", "{root}/assets/decompile/d2-a/secret.json"]

[access]
weights = "code"
