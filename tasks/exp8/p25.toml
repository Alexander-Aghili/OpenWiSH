# Generated by scripts/prepare_exp8.py from github.com/RikiyaT/lm_understand-logs (CC BY 4.0).
id = "exp8-p25"
description = "Experiment 8: make Qwen3.5-0.8B better at math by editing its weights; Python over the weights and 25 forward passes."
prompt = "../../assets/exp8/prompts/p25.txt"
hidden = ["../../assets/exp8/eval"]

[network]
base = "../../assets/exp8/base_net"

[[mounts]]
host = "../../assets/exp8/qwen35-text"
guest = "/model"

[[mounts]]
host = "../../assets/exp8/practice"
guest = "/practice"

[python]
runs = 300
timeout_s = 900
mem_gb = 24
max_out = 10000
prelude = "prelude.py"

[forward.forward]
command = ["{root}/assets/venvs/sandbox/bin/python", "-I", "{root}/python/adapters/qwen_pass.py"]
passes = 25
out_dir = "fwd_{k}"
max_out = 10000
timeout_s = 7200

[edits.policy]
forbidden = ["model.language_model.norm.weight", "model.language_model.embed_tokens.weight", "lm_head.weight"]
forbid_whole_tensor_scale = true

[finish]
require_all_passes = true
max_turns = 600

[handoff]
max_turns_per_conversation = 40

[editor]
effort = "max"

[score]
command = ["{root}/assets/venvs/sandbox/bin/python", "-I", "{root}/python/adapters/qwen_pass.py", "--evaluate", "--sets", "math500", "--limit", "500"]
